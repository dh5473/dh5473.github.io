<svg viewBox="0 0 360 292" style="width: 100%; height: auto; max-width: 360px;"
     xmlns="http://www.w3.org/2000/svg"
     font-family="Pretendard, -apple-system, sans-serif"
     role="img" aria-label="xid 번호선 위에 799, 806, 812가 표시되어 있고 806이 Session A snapshot의 xmin, 812가 xmax입니다. 그 아래 구 버전 튜플은 t_xmin 799에 t_xmax 812이고 balance가 5000, 신 버전 튜플은 t_xmin 812에 t_xmax 0이고 balance가 7000입니다.">
<style>
.qmv2-t { fill: var(--text, #1c1917); }
.qmv2-m { fill: var(--text-muted, #6d6762); }
.qmv2-k { fill: var(--primary, #0a756c); font-weight: 600; }
.qmv2-a { fill: var(--accent, #9d5604); font-weight: 600; }
.qmv2-ax { stroke: var(--text-muted, #6d6762); stroke-width: 1.8; fill: none; }
.qmv2-tick { stroke: var(--primary, #0a756c); stroke-width: 2; }
.qmv2-tickm { stroke: var(--text-muted, #6d6762); stroke-width: 2; }
.qmv2-card { fill: var(--bg-subtle, #f5f4f2); stroke: var(--border, #e7e5e4); stroke-width: 1.5; }
</style>
<defs>
<marker id="qmv2Arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="var(--text-muted, #6d6762)"/></marker>
</defs>
<text x="180" y="26" text-anchor="middle" font-size="16" font-weight="600" class="qmv2-t">두 튜플 버전과 Session A의 snapshot</text>
<line x1="24" y1="88" x2="346" y2="88" class="qmv2-ax" marker-end="url(#qmv2Arrow)"/>
<line x1="60" y1="82" x2="60" y2="94" class="qmv2-tickm"/>
<line x1="160" y1="80" x2="160" y2="96" class="qmv2-tick"/>
<line x1="280" y1="80" x2="280" y2="96" class="qmv2-tick"/>
<text x="60" y="72" text-anchor="middle" font-size="14" class="qmv2-t">799</text>
<text x="160" y="72" text-anchor="middle" font-size="14" class="qmv2-k">806</text>
<text x="280" y="72" text-anchor="middle" font-size="14" class="qmv2-a">812</text>
<text x="160" y="114" text-anchor="middle" font-size="14" class="qmv2-k">snapshot xmin</text>
<text x="280" y="114" text-anchor="middle" font-size="14" class="qmv2-a">snapshot xmax</text>
<rect x="20" y="140" width="320" height="54" rx="8" class="qmv2-card"/>
<text x="36" y="164" font-size="15" class="qmv2-t">구 버전   balance = 5000</text>
<text x="36" y="186" font-size="14" class="qmv2-m">t_xmin 799      t_xmax 812</text>
<rect x="20" y="204" width="320" height="54" rx="8" class="qmv2-card"/>
<text x="36" y="228" font-size="15" class="qmv2-t">신 버전   balance = 7000</text>
<text x="36" y="250" font-size="14" class="qmv2-m">t_xmin 812      t_xmax 0</text>
<text x="180" y="280" text-anchor="middle" font-size="14" class="qmv2-m">Session B가 xid 812로 UPDATE 후 커밋한 상태</text>
</svg>
